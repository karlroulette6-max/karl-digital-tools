<!DOCTYPE html>
<html>
<head>
<title>USDT BEP20 Payment</title>

<style>

body{
background:#020617;
display:flex;

}

.box{

padding:50px;

}

h1{

.price{

}

.address{

button{
padding:18px 45px;
border:none;

<body>

<div class="box">

<h1>USDT BEP20</h1>

<div class="address" id="wallet">

</div>

<button onclick="copyWallet()">
Copy Wallet Address
</button>

<p>
Telegram Support:
<br><br>
<a href="https://t.me/Karlroul">

</div>

<script>

function copyWallet(){

const text =
document.getElementById("wallet").innerText;
