<!DOCTYPE html>

<style>

body{
    margin:0;

    background:#050816;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:600px;
    background:#101935;
    padding:40px;

h1{

    word-break:break-all;

    margin-bottom:25px;

button{
    padding:15px 35px;
    border:none;
    border-radius:12px;
    background:linear-gradient(to right,#7b2fff,#2962ff);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.telegram{

.telegram a{

.note{

function copyWallet(){

const wallet =
document.getElementById("wallet").innerText;

navigator.clipboard.writeText(wallet);

alert("Wallet Address Copied!");

}

</script>
