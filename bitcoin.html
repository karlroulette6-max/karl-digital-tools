<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Payment</title>

<style>

body{
margin:0;
padding:0;
background:#050816;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#101935;
padding:40px;
border-radius:20px;
width:90%;
max-width:600px;
text-align:center;
}

h1{
font-size:50px;
}

.price{
font-size:35px;
color:#ffb300;
margin:20px 0;
}

.wallet{
background:#091126;
padding:20px;
border-radius:12px;
word-break:break-all;
font-size:18px;
margin:20px 0;
}

button{
padding:15px 35px;
border:none;
border-radius:12px;
background:#ff9800;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

a{
color:#66aaff;
text-decoration:none;
}

</style>
</head>

<body>

<div class="box">

<h1>Bitcoin Payment</h1>

<div class="price">
$100
</div>

<div class="wallet" id="wallet">
1NBfDETZoYfUF5zNsuTSnm8pGxcGzdRfUU
</div>

<button onclick="copyWallet()">
Copy BTC Address
</button>

<br><br><br>

Telegram:
<br><br>

<a href="https://t.me/Karlroul">
https://t.me/Karlroul
</a>

</div>

<script>

function copyWallet(){

const wallet =
document.getElementById("wallet").innerText;

navigator.clipboard.writeText(wallet);

alert("Bitcoin Address Copied!");

}

</script>
<!-- TELEGRAM BUTTON -->

<a href="https://t.me/Karlroul" class="telegram-chat" target="_blank">

<img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">

</a>

<!-- WHATSAPP BUTTON -->

<a href="https://wa.me/14423423840" class="whatsapp-chat" target="_blank">

<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">

</a>

<style>

.telegram-chat{
position:fixed;
bottom:25px;
right:25px;
width:65px;
height:65px;
background:#229ED9;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 20px rgba(0,0,0,0.4);
z-index:9999;
transition:0.3s;
}

.telegram-chat:hover{
transform:scale(1.1);
}

.telegram-chat img{
width:35px;
height:35px;
}

.whatsapp-chat{
position:fixed;
bottom:105px;
right:25px;
width:65px;
height:65px;
background:#25D366;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 20px rgba(0,0,0,0.4);
z-index:9999;
transition:0.3s;
}

.whatsapp-chat:hover{
transform:scale(1.1);
}

.whatsapp-chat img{
width:35px;
height:35px;
}

</style>
</body>
</html>
