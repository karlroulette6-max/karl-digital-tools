<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Payment</title>

<style>

body{
margin:0;
padding:0;
background:#050816;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#101935;
padding:40px;
border-radius:20px;
width:90%;
max-width:600px;
text-align:center;
}

h1{
font-size:50px;
}

.price{
font-size:35px;
color:#ffb300;
margin:20px 0;
}

.wallet{
background:#091126;
padding:20px;
border-radius:12px;
word-break:break-all;
font-size:18px;
margin:20px 0;
}

button{
padding:15px 35px;
border:none;
border-radius:12px;
background:#ff9800;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

a{
color:#66aaff;
text-decoration:none;
}

</style>
</head>

<body>

<div class="box">

<h1>Bitcoin Payment</h1>

<div class="price">
$100
</div>

<div class="wallet" id="wallet">
1NBfDETZoYfUF5zNsuTSnm8pGxcGzdRfUU
</div>

<button onclick="copyWallet()">
Copy BTC Address
</button>

<br><br><br>

Telegram:
<br><br>

<a href="https://t.me/Karlroul">
https://t.me/Karlroul
</a>

</div>

<script>

function copyWallet(){

const wallet =
document.getElementById("wallet").innerText;

navigator.clipboard.writeText(wallet);

alert("Bitcoin Address Copied!");

}

</script>

</body>
</html>
